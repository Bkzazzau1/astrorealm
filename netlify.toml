[build]
  publish = "."
  functions = "netlify/functions"

# Map /api/reading → the serverless function
[[redirects]]
  from = "/api/reading"
  to = "/.netlify/functions/reading"
  status = 200
  force = true

[[redirects]]
  from = "/api/tasks"
  to = "/.netlify/functions/tasks"
  status = 200
  force = true
