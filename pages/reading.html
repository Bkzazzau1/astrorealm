<!DOCTYPE html>

  <head>

    <style>
      /* ... [All your CSS styles remain unchanged] ... */
      .wrap {
        max-width: 960px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 18px 16px;
        background: rgba(8, 8, 20, 0.9);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .reading-title {
        font-size: 1.4rem;
        margin-bottom: 0.35rem;
      }
      .meta {
        font-size: 0.86rem;
        color: var(--muted);
        margin-bottom: 0.9rem;
      }
      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 1.1rem;
      }
      .pill {
        font-size: 0.78rem;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(212, 175, 55, 0.32);
        color: #f8f3e3;
        background: radial-gradient(circle at 0 0, rgba(212, 175, 55, 0.22), transparent);
      }
      .reading-body {
        line-height: 1.6;
        font-size: 0.96rem;
        white-space: pre-wrap;
      }
      .reading-body.skeleton {
        min-height: 96px;
        animation: shimmer 1.4s infinite linear;
        background: linear-gradient(90deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.04)
        );
        background-size: 200% 100%;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .error-box {
        margin-top: 0.75rem;
        font-size: 0.82rem;
        color: #ffb3b3;
        background: rgba(180, 40, 40, 0.18);
        border-radius: 8px;
        padding: 8px 10px;
        display: none;
      }
      .actions {
        margin-top: 1.4rem;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .btn-main {
        padding: 0.7rem 1.3rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #f4d27a, #d4af37);
        border: none;
        color: #1a1028;
        font-weight: 600;
        text-decoration: none;
      }
      .btn-ghost {
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(8,8,16,0.8);
        color: #fff;
        text-decoration: none;
      }
      .footer-note {
        font-size: 0.8rem;
        margin-top: 1rem;
        color: var(--muted);
      }
    </style>
  </head>

  <body class="sky-static">
    <div class="container">

      <header class="header">
        <a class="logo" href="../index.html">
          <img src="../assets/img/logo.svg" alt="AstroRealm logo" />
          <span>AstroRealm</span>
        </a>
        <nav class="nav">
          <a href="./topics.html">Topics</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </header>

      <main class="wrap">
        <section class="card">
          <p class="eyebrow">Unlocked reading</p>
          <h1 id="reading-title" class="reading-title">Your cosmic message</h1>
          <p id="reading-meta" class="meta"></p>
          <div id="pill-row" class="pill-row"></div>
          <div id="reading-output" class="reading-body skeleton"></div>
          <div id="reading-error" class="error-box"></div>
          <div class="actions">
            <a id="ask-again-link" href="./topics.html" class="btn-main">Ask another question</a>
            <a href="../index.html" class="btn-ghost">Back to home</a>
          </div>
          <p class="footer-note">
            Readings are for guidance and reflection only. No medical, legal, gambling or guaranteed financial outcomes.
          </p>
        </section>
      </main>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);

        // --- 1. Get Base Parameters (unchanged) ---
        const topic = (params.get("topic") || "destiny").toLowerCase();
        const question = params.get("question") || params.get("q") || "";
        const name = params.get("name") || "";
        const dob = params.get("dob") || "";
        const mother = params.get("mother") || "";
        const lang = params.get("lang") || "en";
        const religion = params.get("religion") || "";
        const from = params.get("from") || topic;
        
        // --- 2. Find UI Elements (unchanged) ---
        const titleEl = document.getElementById("reading-title");
        const metaEl = document.getElementById("reading-meta");
        const pillRow = document.getElementById("pill-row");
        const outEl = document.getElementById("reading-output");
        const errEl = document.getElementById("reading-error");
        const askLink = document.getElementById("ask-again-link");

        // --- 3. Set up UI (unchanged) ---
        const topicLabelMap = {
          zodiac: "Zodiac", palmistry: "Palmistry", geomancy: "Geomancy",
          destiny: "Destiny", weekly: "Weekly Guidance", love: "Love",
          money: "Money", career: "Career", astrosport: "Astro Sport",
        };
        const niceTopic = topicLabelMap[topic] || topic;
        titleEl.textContent = `Your ${niceTopic} Reading`;
        metaEl.innerHTML = `Question: <strong>${escapeHtml(question)}</strong>` +
          (name ? ` • Name: <strong>${escapeHtml(name)}</strong>` : "");
        
        // --- 4. Add Pills (unchanged) ---
        addPill(`Topic: ${niceTopic}`);
        addPill(`Language: ${lang.toUpperCase()}`);
        if (dob) addPill(`DOB: ${dob}`);
        if (mother) addPill(`Mother: ${mother}`);
        if (religion) addPill(`Religion: ${religion}`);
        
        // Add pills for other topics if they exist in URL
        if (params.get("focusLine")) addPill(`Focus: ${params.get("focusLine")}`);
        if (params.get("partner_name")) addPill(`Partner: ${params.get("partner_name")}`);

        // --- 5. Back Link (unchanged) ---
        const map = {
          zodiac: './zodiac.html', palmistry: './palmistry.html', geomancy: './geomancy.html',
          weekly: './weekly.html', love: './love.html', money: './money.html',
          career: './career.html', destiny: './destiny.html', astrosport: './astrosport.html',
        };
        // This is why we passed 'from=' in all our forms
        askLink.href = map[from] || './topics.html';

        // --- 6. *** UPDATED: Build API Payload *** ---
        // This now gathers ALL parameters from the URL and sends them.
        // Your API can now pick what it needs based on 'topic'.
        const apiPayload = {};
        for (const [key, value] of params.entries()) {
            apiPayload[key] = value;
        }
        
        // Manually add 'topic' in case it wasn't in the URL (as a fallback)
        apiPayload.topic = topic;

        // --- 7. Fetch API (Now sends the universal payload) ---
        fetch('/api/reading', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // Send the entire payload, which includes 'names_with_houses' etc.
          body: JSON.stringify(apiPayload) 
        })
        .then(res => res.json())
        .then(data => {
          const text = data.reading || data.text || "";
          if (!text) throw new Error("Empty reading");
          showReading(text);
        })
        .catch(err => {
          console.error(err); // Log the actual error
          errEl.style.display = "block";
          errEl.textContent = "Unable to reach reading server. Showing fallback.";
          showReading(buildFallback());
        });

        // --- 8. Helper Functions (unchanged) ---
        function showReading(t) {
          outEl.classList.remove("skeleton");
          outEl.textContent = t;
        }

        function addPill(txt) {
          if (!txt) return; // Don't add empty pills
          const div = document.createElement("div");
          div.className = "pill";
          div.textContent = txt;
          pillRow.appendChild(div);
        }

        function escapeHtml(s) {
          if (!s) return '';
          return s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
        }

        function buildFallback() {
          return `Dear ${name || "seeker"},
         
Your question shows you're entering a period of transition.  
Stay calm, avoid rushing decisions, and be open to guidance.  
Your inner intuition is preparing you for a breakthrough.

Continue taking small steps in the direction of your purpose.`;
        }
      })();
    </script>
    </body>
</html>
