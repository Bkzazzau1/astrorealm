<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zodiac Reading ✨ • AstroRealm</title>
    <meta
      name="description"
      content="Enter your name, date of birth (or mother’s first name), and ask your question for a zodiac reading."
    />

    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <style>
      /* ... [All your CSS styles remain unchanged] ... */
      .wrap {
        max-width: 940px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid rgba(255, 215, 0, 0.25);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        padding: 16px;
      }
      .field {
        margin: 12px 0;
      }
      .field label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
        color: #ffd700;
      }
      .field input[type='text'],
      .field input[type='date'],
      .field select,
      .field textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #000;
        color: #fff;
        outline: none;
      }
      select option {
        background-color: #000;
        color: #fff;
      }
      .hint {
        color: var(--muted);
      }
      .row {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 760px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 215, 0, 0.35);
        background: rgba(255, 215, 0, 0.06);
        color: #ffd700;
        font-weight: 600;
      }
      .unlock-btn {
        display: inline-block;
        width: 100%;
        text-align: center;
        padding: 14px 18px;
        border-radius: 12px;
        background: linear-gradient(180deg, #ffe6a3, #d4af37 60%, #7a5a12);
        color: #1a1200;
        font-weight: 800;
        text-decoration: none;
        /* Add button styles */
        cursor: pointer;
        font-family: inherit;
        font-size: inherit;
      }
      .err {
        color: #ffb3b3;
        font-size: 0.95rem;
        margin-top: 8px;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
    </style>
  </head>

  <body class="sky-static">
    <div class="container wrap">
      <header class="header">
        <a class="logo" href="../index.html">
          <img src="../assets/img/logo.svg" alt="AstroRealm logo" />
          <span>AstroRealm</span>
        </a>
        <nav class="nav">
          <a href="./topics.html">Topics</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </header>

      <h1 class="mt-2">Zodiac Reading ✨</h1>
      <p class="hint">
        Enter your <b>name</b> and date of birth to auto-detect your sign. If DOB is unknown, enter
        your mother’s first name.
      </p>

      <section class="card mt-2">
        <div class="field">
          <span class="pill" id="signPreview">Sign: —</span>
        </div>

        <div class="field">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="e.g., Ibrahim" />
        </div>

        <div class="row">
          <div class="field">
            <label for="dob">Date of Birth (if known)</label>
            <input type="date" id="dob" />
          </div>
          <div class="field">
            <label for="mother">Mother’s First Name (if DOB unknown)</label>
            <input type="text" id="mother" placeholder="e.g., Maryam" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="question">Your Question</label>
            <textarea id="question"></textarea>
          </div>
          <div class="field">
            <label for="lang">Answer Language</label>
            <select id="lang">
              <option value="">— Select language —</option>
              <option value="en">English</option>
              <option value="ha">Hausa</option>
              <option value="ar">Arabic</option>
              <option value="fr">French</option>
              <option value="es">Spanish</option>
              <option value="hi">Hindi</option>
            </select>
          </div>
        </div>

        <div id="err" class="err"></div>

        <div class="field">
          <button id="submitBtn" class="unlock-btn">
            Submit & Get Reading
          </button>
        </div>
        <small class="hint">
          Compliance: No medical, legal, gambling, or guaranteed financial outcomes.
        </small>
      </section>

      <footer class="footer mt-3">
        © 2025 AstroRealm · <a href="./terms.html">Terms</a> · <a href="./privacy.html">Privacy</a>
      </footer>
    </div>

    <script>
      // --- All your sign logic remains unchanged ---
      const SIGNS = [
        { key: "Aries", glyph: "♈", start: [3, 21], end: [4, 19] },
        { key: "Taurus", glyph: "♉", start: [4, 20], end: [5, 20] },
        { key: "Gemini", glyph: "♊", start: [5, 21], end: [6, 20] },
        { key: "Cancer", glyph: "♋", start: [6, 21], end: [7, 22] },
        { key: "Leo", glyph: "♌", start: [7, 23], end: [8, 22] },
        { key: "Virgo", glyph: "♍", start: [8, 23], end: [9, 22] },
        { key: "Libra", glyph: "♎", start: [9, 23], end: [10, 22] },
        { key: "Scorpio", glyph: "♏", start: [10, 23], end: [11, 21] },
        { key: "Sagittarius", glyph: "♐", start: [11, 22], end: [12, 21] },
        { key: "Capricorn", glyph: "♑", start: [12, 22], end: [1, 19] },
        { key: "Aquarius", glyph: "♒", start: [1, 20], end: [2, 18] },
        { key: "Pisces", glyph: "♓", start: [2, 19], end: [3, 20] }
      ];

      function inRange(m, d, sM, sD, eM, eD) {
        if (sM < eM || (sM === eM && sD <= eD)) {
          return (m > sM || (m === sM && d >= sD)) && (m < eM || (m === eM && d <= eD));
        } else {
          return m > sM || (m === sM && d >= sD) || m < eM || (m === eM && d <= eD);
        }
      }

      function signFromDate(str) {
        if (!str) return null;
        const dt = new Date(str + "T00:00:00");
        if (isNaN(dt.getTime())) return null;
        const m = dt.getMonth() + 1,
          d = dt.getDate();
        for (const s of SIGNS) {
          const [sM, sD] = s.start, [eM, eD] = s.end;
          if (inRange(m, d, sM, sD, eM, eD)) return s;
        }
        return null;
      }

      function showError(msg) {
        document.getElementById("err").textContent = msg || "";
      }

      function val(id) {
        return document.getElementById(id)?.value.trim() || "";
      }
      
      // --- This is the updated part ---
      document.addEventListener("DOMContentLoaded", () => {
        const dobEl = document.getElementById("dob");
        const submitBtn = document.getElementById("submitBtn"); // Changed from unlockBtn

        // Sign preview logic (unchanged)
        dobEl.addEventListener("input", () => {
          const s = signFromDate(dobEl.value);
          document.getElementById("signPreview").textContent =
            "Sign: " + (s ? `${s.key} ${s.glyph}` : "—");
        });

        // Click handler
        submitBtn.addEventListener("click", (e) => {
          e.preventDefault(); // Stop the button's default action
          showError("");
          
          // --- 1. Validation (from your original script) ---
          const name = val("name");
          const dob = val("dob");
          const mother = val("mother");
          const question = val("question");
          const lang = val("lang");

          if (!name) {
            return showError("Please enter your name.");
          }
          if (!dob && !mother) {
            return showError("Provide DOB or mother’s first name.");
          }
          if (!question) {
            return showError("Please write your question.");
          }
          if (!lang) {
            return showError("Select your answer language.");
          }
          
          // --- 2. Build URL Parameters ---
          const params = new URLSearchParams();
          params.set('topic', 'zodiac');
          params.set('from', 'zodiac'); // For the "Ask Again" link

          // Set primary data
          params.set('question', question);
          params.set('lang', lang);
          params.set('name', name);
          
          // Set seeker data
          if (dob) {
             params.set('dob', dob);
          } else if (mother) {
             params.set('mother', mother);
          }
          
          // Add sign if we detected it
          if (dob) {
            const s = signFromDate(dob);
            if (s) {
              params.set('sign', s.key);
            }
          }

          // --- 3. Redirect to the locked reading page ---
          // The reading.html page will lock, then read these params
          location.href = './reading.html?' + params.toString();
        });
      });
    </script>
    </body>
</html>
