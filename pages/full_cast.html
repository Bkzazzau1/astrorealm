<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shield Chart • AstroRealm</title>
    <meta name="description" content="Your full geomancy shield chart generated from 4 figures." />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <style>
      /* ... [All your CSS styles remain unchanged] ... */
      :root {
        --bg: #0d1b2a;
        --panel: #1b263b;
        --gold: #d4af37;
      }
      body.sky-static {
        background-color: var(--bg);
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
      }
      .hint {
        color: var(--muted);
      }
      .card {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 12px;
      }
      .q-card {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .q-card i {
        opacity: 0.7;
      }
      .row-figs {
        display: flex;
        gap: 18px;
        justify-content: space-evenly;
        flex-wrap: wrap;
      }
      .fig {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 82px;
      }
      .fig-box {
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
      }
      .dot-row {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 6px 0;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      }
      .fig-label {
        margin-top: 4px;
        font-size: 12px;
        color: #ffffffb3;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 12px 18px;
        border-radius: 10px;
        border: 0;
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-save {
        display: none !important;
      }
      .btn-view {
        background: var(--gold);
        color: #0a0a0a;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        justify-content: flex-start;
        flex-wrap: wrap;
      }
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: #0008;
        backdrop-filter: blur(2px);
      }
      .modal-card {
        position: relative;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 16px;
        width: min(520px, 92vw);
      }
      .field {
        margin: 10px 0;
      }
      .input,
      .select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        color: var(--text);
      }
      .select option,
      select option {
        background: #000;
        color: #fff;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .pill {
        padding: 10px 16px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .pill.primary {
        background: var(--gold);
        color: #0a0a0a;
        border-color: var(--gold);
        font-weight: 700;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        margin-bottom: 8px;
      }
      .top-actions a {
        color: var(--text);
        opacity: 0.85;
      }
    </style>
  </head>
  <body class="sky-static">
    <div class="container wrap">
      <header class="header">
        <a class="logo" href="../index.html"
          ><img src="../assets/img/logo.svg" alt="AstroRealm logo" /><span>AstroRealm</span></a
        >
        <nav class="nav">
          <a href="./casting.html">Re-cast</a>
          <a href="./topics.html">Topics</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </header>

      <div class="topbar">
        <h1>Shield Chart</h1>
        <div class="top-actions">
          <a href="../index.html" title="Back to home">Home</a>
        </div>
      </div>
      <div class="card q-card">
        <i>❓</i>
        <p id="qtext" style="margin: 0"></p>
      </div>
      <div class="mt-2">
        <div id="row1" class="row-figs mt-1"></div>
        <div id="row2" class="row-figs mt-2"></div>
        <div id="row3" class="row-figs mt-2"></div>
        <div id="row4" class="row-figs mt-2"></div>
        <div id="row5" class="row-figs mt-2"></div>
      </div>
      <div class="toolbar mt-3">
        <button id="saveBtn" class="btn btn-save">💾 <span id="saveLabel">Save Chart</span></button>
        <button id="viewBtn" class="btn btn-view">
          📖 <span id="viewLabel">View Interpretation</span>
        </button>
      </div>

      <footer class="footer mt-3">
        © 2025 AstroRealm · <a href="./terms.html">Terms</a> · <a href="./privacy.html">Privacy</a>
      </footer>
    </div>

    <div
      id="settingsModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="modal-backdrop"></div>
      <div class="modal-card">
        <h3 id="settingsTitle" style="margin: 0 0 8px">Interpretation Settings</h3>
        <p class="hint" style="margin: 0 0 8px">Choose language and religion, then continue.</p>
        <div class="field">
          <label class="hint" for="langSel">Language</label>
          <select id="langSel" class="select">
            <option value="en" selected>English</option>
            <option value="ha">Hausa</option>
            <option value="ar">Arabic</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="hi">Hindi</option>
          </select>
        </div>
        <div class="field">
          <label class="hint" for="relSel">Religion</label>
          <select id="relSel" class="select">
            <option value="" selected disabled>Choose…</option>
            <option value="islam">Islam</option>
            <option value="christian">Christian</option>
            <option value="traditional">Traditional</option>
            <option value="none">Neutral</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="pill" id="cancelSettings">Cancel</button>
          <button class="pill primary" id="confirmSettings">Confirm</button>
        </div>
      </div>
    </div>

    <script>
      // -------------------- Utilities & State (UNCHANGED) --------------------
      const qText = document.getElementById('qtext');
      const row1 = document.getElementById('row1');
      const row2 = document.getElementById('row2');
      const row3 = document.getElementById('row3');
      const row4 = document.getElementById('row4');
      const row5 = document.getElementById('row5');
      const saveBtn = document.getElementById('saveBtn');
      const saveLabel = document.getElementById('saveLabel');
      const viewBtn = document.getElementById('viewBtn');
      const viewLabel = document.getElementById('viewLabel');
      const settingsModal = document.getElementById('settingsModal');
      const langSel = document.getElementById('langSel');
      const relSel = document.getElementById('relSel');
      const cancelSettings = document.getElementById('cancelSettings');
      const confirmSettings = document.getElementById('confirmSettings');

      let NAV_LOCK = false;
      let SAVING = false;
      
      const LATIN_BY_TOKEN = {
        1111: 'Via', 2222: 'Populus', 2211: 'Fortuna Major', 1122: 'Fortuna Minor',
        2121: 'Acquisitio', 1212: 'Amissio', 2212: 'Albus', 2122: 'Rubeus',
        1121: 'Puer', 1211: 'Puella', 2112: 'Coniunctio', 1221: 'Carcer',
        2221: 'Tristitia', 1222: 'Laetitia', 2111: 'Caput Draconis', 1112: 'Cauda Draconis',
      };
      const latinFromFig = (fig) => LATIN_BY_TOKEN[fig.join('')] || fig.join('');
      const combine = (a, b) => [0, 1, 2, 3].map((i) => ((a[i] + b[i]) % 2 === 0 ? 2 : 1));

      function figBox(fig, label) {
        const wrap = document.createElement('div');
        wrap.className = 'fig';
        const box = document.createElement('div');
        box.className = 'fig-box';
        fig.forEach((v) => {
          const row = document.createElement('div');
          row.className = 'dot-row';
          if (v === 1) {
            const d = document.createElement('div');
            d.className = 'dot';
            row.appendChild(d);
          } else {
            const d1 = document.createElement('div');
            d1.className = 'dot';
            const d2 = document.createElement('div');
            d2.className = 'dot';
            row.appendChild(d1);
            row.appendChild(d2);
          }
          box.appendChild(row);
        });
        const lab = document.createElement('div');
        lab.className = 'fig-label';
        lab.textContent = label;
        wrap.appendChild(box);
        wrap.appendChild(lab);
        return wrap;
      }

      // --------------- Load data from casting step (UNCHANGED) ---------------
      let payload = null;
      try {
        payload = JSON.parse(localStorage.getItem('astro_cast_payload') || 'null');
      } catch {}
      if (!payload || !Array.isArray(payload.mothers) || payload.mothers.length !== 4) {
        document.body.insertAdjacentHTML(
          'beforeend',
          `<div class="container wrap"><div class="card mt-2" style="text-align:center">
          <p>Could not find your casting in this browser.</p>
          <a class="pill primary" href="./casting.html">Cast again</a>
          </div></div>`
        );
      }

      const mothers = (payload?.mothers || []).map((a) => a.map(Number));
      const question = (payload?.question || '').trim();
      const selectedLanguageInit = payload?.language || 'en';
      qText.textContent = question;

      // --- All chart calculation logic is UNCHANGED ---
      const daughters = [
        [mothers[0][0], mothers[1][0], mothers[2][0], mothers[3][0]],
        [mothers[0][1], mothers[1][1], mothers[2][1], mothers[3][1]],
        [mothers[0][2], mothers[1][2], mothers[2][2], mothers[3][2]],
        [mothers[0][3], mothers[1][3], mothers[2][3], mothers[3][3]],
      ];
      const nieces = [
        combine(mothers[0], mothers[1]),
        combine(mothers[2], mothers[3]),
        combine(daughters[0], daughters[1]),
        combine(daughters[2], daughters[3]),
      ];
      const witnesses = [combine(nieces[1], nieces[0]), combine(nieces[3], nieces[2])];
      const judge = combine(witnesses[1], witnesses[0]);
      const reconciler = combine(judge, mothers[0]);
      
      // *** This is the array of all 16 figures your API needs ***
      const allFiguresRaw = [...mothers, ...daughters, ...nieces, ...witnesses, judge, reconciler];


      // ---------- Render logic is UNCHANGED ----------
      [
        daughters[3], daughters[2], daughters[1], daughters[0],
        mothers[3], mothers[2], mothers[1], mothers[0],
      ].forEach((f, i) =>
        row1.appendChild(figBox(f, ['T8', 'T7', 'T6', 'T5', 'T4', 'T3', 'T2', 'T1'][i]))
      );
      [nieces[3], nieces[2], nieces[1], nieces[0]].forEach((f, i) =>
        row2.appendChild(figBox(f, ['T12', 'T11', 'T10', 'T9'][i]))
      );
      [witnesses[1], witnesses[0]].forEach((f, i) =>
        row3.appendChild(figBox(f, ['T14', 'T13'][i]))
      );
      row4.appendChild(figBox(judge, 'T15'));
      row5.appendChild(figBox(reconciler, 'T16'));

      // --------------- Save Chart logic is UNTOUCHED ---------------
      async function saveChart() {
        if (SAVING) return;
        SAVING = true;
        saveBtn.disabled = true;
        saveLabel.textContent = 'Saving…';
        try {
          // [Your original save logic... unchanged]
          const mothersJson = JSON.stringify(mothers);
          localStorage.setItem('saved_mothers', mothersJson);
          localStorage.setItem('saved_question', question);
          localStorage.setItem('saved_language', selectedLanguageInit);
          localStorage.setItem('saved_date', new Date().toISOString());
          const figureNames = allFiguresRaw.map((f) => f.join(''));
          const cloud = JSON.parse(localStorage.getItem('astro_readings') || '[]');
          cloud.push({ question, figures: figureNames, savedAt: Date.now() });
          localStorage.setItem('astro_readings', JSON.stringify(cloud));
          
          saveLabel.textContent = 'Saved!';
          setTimeout(() => {
            saveLabel.textContent = 'Save Chart';
          }, 1200);
        } catch (e) {
          console.error('Save error:', e);
          saveLabel.textContent = 'Failed — retry';
        } finally {
          saveBtn.disabled = false;
          SAVING = false;
        }
      }
      saveBtn.addEventListener('click', saveChart);

      // ------------------ *** UPDATED SCRIPT LOGIC *** ------------------
      // This section is now consistent with your other form pages.
      
      function openSettings() {
        settingsModal.classList.add('show');
      }
      function closeSettings() {
        settingsModal.classList.remove('show');
      }
      cancelSettings.addEventListener('click', () => {
        closeSettings();
        NAV_LOCK = false;
        viewLabel.textContent = 'View Interpretation';
      });

      // UPDATED: This now builds URL params and redirects to reading.html
      confirmSettings.addEventListener('click', () => {
        const lang = langSel.value;
        const rel = relSel.value;
        if (!lang || !rel) {
          alert('Choose both language and religion.');
          return;
        }
        closeSettings();

        // --- 1. Build URL Parameters ---
        const params = new URLSearchParams();
        params.set('topic', 'geomancy');
        params.set('from', 'geomancy'); // For the "Ask Again" link

        // Set primary data
        // 'question' is from the outer scope, loaded from 'astro_cast_payload'
        params.set('question', question); 
        params.set('lang', lang);
        params.set('religion', rel);
        
        // --- 2. Build and add the 16 figures as requested ---
        // 'allFiguresRaw' was calculated above when the chart was built
        const namesWithHouses = allFiguresRaw.map((fig, i) => {
          // We map T1..T8, then T9..T12, etc. This order matches your render.
          // This is complex, so let's use the Latin names as requested.
          // Your original script had the correct `names_with_houses` logic:
          const flutterOrderFigs = [
             mothers[0], mothers[1], mothers[2], mothers[3],
             daughters[0], daughters[1], daughters[2], daughters[3],
             nieces[0], nieces[1], nieces[2], nieces[3],
             witnesses[0], witnesses[1],
             judge,
             reconciler
          ];
          const namesWithHousesList = flutterOrderFigs.map((f, i) => ({
             house: i + 1,
             name: latinFromFig(f)
          }));
          return namesWithHousesList;
        })[0]; // Get the list from the map
        
        // Add the 16 figures to the URL
        try {
           params.set('names_with_houses', JSON.stringify(namesWithHouses));
        } catch (e) {
           console.error("Could not stringify names_with_houses", e);
        }

        // --- 3. Redirect to the locked reading page ---
        // This is the same flow as all your other form pages.
        window.location.href = './reading.html?' + params.toString();
      });

      // This logic is UNCHANGED
      viewBtn.addEventListener('click', () => {
        if (NAV_LOCK) return;
        NAV_LOCK = true;
        viewBtn.disabled = true;
        viewLabel.textContent = 'Opening…';
        langSel.value = selectedLanguageInit || 'en';
        relSel.value = '';
        openSettings();
        setTimeout(() => {
          viewBtn.disabled = false;
        }, 50);
      });
    </script>
  </body>
</html>
